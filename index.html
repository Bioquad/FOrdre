<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FOrdre — preparació de kits de muntatge: safates a mida per imprimir en 3D i etiquetes per a cada conjunt">
    <!--
      ════════════════════════════════════════════════════════════
      FOrdre — Kits de muntatge ordenats
      A partir d'un arbre de conjunts (peces, cargoleria, consumibles
      i subconjunts muntats) genera, per a cada pas de muntatge, les
      safates amb un caixetí a mida per a cada material, en STL per
      imprimir en 3D, i les etiquetes (text, color, QR, codi de
      barres, RFID/NFC) per identificar cada caixetí.

      © Bioquad — Llicència CERN-OHL-S-2.0
      Basat en FDins (simulador 3D de càrrega de contenidors).
      No cal instal·lació: obre aquest fitxer amb un navegador modern.
      ════════════════════════════════════════════════════════════
    -->
    <title>FOrdre — Kits de muntatge</title>
    <link rel="stylesheet" href="css/fordre.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
    <div class="tb">
        <div class="tb-t">F<span>O</span>rdre</div>
        <div class="tb-n" id="nomProjecte" title="Nom del projecte (clic per canviar-lo)"></div>
        <button class="b" id="bNou" title="Projecte nou, buit">Nou</button>
        <button class="b" id="bObrir" title="Obrir un projecte (.json)">Obrir</button>
        <button class="b" id="bDesar" title="Desar el projecte (.json)">Desar</button>
        <button class="b" id="bExemple" title="Carregar el projecte d'exemple">Exemple</button>
        <span class="sp"></span>
        <button class="b pr" id="bImportar" title="Importar una llista de peces (CSV, Excel o BOM de CAD)">Importar llista</button>
        <button class="b" id="bPlantilla" title="Descarregar una plantilla CSV per omplir">Plantilla CSV</button>
        <span class="sp"></span>
        <button class="b" id="bSTL" title="Totes les safates en STL, dins un ZIP">⬇ STL (ZIP)</button>
        <button class="b" id="bEtiquetes" title="Imprimir totes les etiquetes">🏷 Etiquetes</button>
        <button class="b" id="bRFID" title="CSV amb les dades de cada etiqueta per a RFID/NFC">RFID / CSV</button>
        <button class="b" id="bFulla" title="Full de preparació imprimible">Full de ruta</button>
        <span class="fl"></span>
        <button class="b" id="bConfig" title="Impressora, gruixos, folgances i etiquetes">⚙ Configuració</button>
        <button class="b" id="bTema" title="Tema clar / fosc">◐</button>
    </div>

    <div class="mn">
        <!-- Esquerra: arbre de conjunts i catàleg -->
        <div class="pn pn-l">
            <div class="tabs">
                <div class="tab on" data-tab="arbre">Arbre de muntatge</div>
                <div class="tab" data-tab="materials">Materials</div>
            </div>
            <div id="tabArbre" style="display:flex;flex-direction:column;flex:1;min-height:0">
                <div class="ps" style="padding:8px">
                    <input class="cerca" id="cerca" type="search" placeholder="Cerca per codi o nom…">
                </div>
                <div class="arbre" id="arbre" tabindex="0"></div>
                <div class="arbre-acc">
                    <button class="b sm" id="bNouConj" title="Conjunt nou a l'arrel">+ Conjunt</button>
                    <button class="b sm" id="bNouSub" title="Subconjunt dins el conjunt seleccionat">+ Subconjunt</button>
                    <button class="b sm" id="bNouMat" title="Material nou dins el conjunt seleccionat">+ Material</button>
                    <button class="b sm" id="bAfegirMat" title="Afegir un material existent al conjunt">+ Existent</button>
                    <span class="fl"></span>
                    <button class="b sm" id="bPujar" title="Moure amunt">▲</button>
                    <button class="b sm" id="bBaixar" title="Moure avall">▼</button>
                    <button class="b sm dg" id="bEliminar" title="Eliminar la selecció">✕</button>
                </div>
            </div>
            <div id="tabMaterials" style="display:none;flex:1;overflow:auto;min-height:0">
                <table class="tt" id="taulaMat"></table>
            </div>
        </div>

        <!-- Centre: vista 3D -->
        <div class="ca" id="ca">
            <canvas id="c3d" tabindex="0"></canvas>
            <div class="cartell" id="cartell"></div>
            <div class="hn" id="hint"></div>
            <div class="vbar">
                <button class="b sm" id="vTot" title="Veure totes les safates">Tot</button>
                <button class="b sm" id="vSel" title="Enfocar la selecció">Enfoca</button>
                <button class="b sm" id="vDalt" title="Vista de planta">Planta</button>
                <button class="b sm on" id="vPeces" title="Mostrar les peces dins els caixetins">Peces</button>
                <button class="b sm on" id="vFalca" title="Mostrar les safates inclinades sobre la falca">Inclinació</button>
            </div>
            <div class="lleg" id="lleg">
                Arrossega: girar · Dret o Maj+arrossega: desplaçar · Roda: zoom · Clic: seleccionar
            </div>
        </div>

        <!-- Dreta: fitxa de la selecció -->
        <div class="pn pn-r" id="fitxa"></div>
    </div>

    <div class="sb" id="sb"></div>

    <!-- Importació -->
    <div class="ov" id="dlgImport">
        <div class="dlg">
            <div class="dlg-h">Importar llista de peces</div>
            <div class="dlg-c">
                <div class="fx">
                    <input type="file" id="impFitxer" accept=".csv,.txt,.tsv,.xlsx,.xls,.xlsm,.ods,.json">
                    <div class="fi" id="impFullBox" style="display:none"><select id="impFull"></select></div>
                </div>
                <div class="fg3">
                    <div class="fi">
                        <label>Format de la llista</label>
                        <select id="impFormat">
                            <option value="pla">FOrdre / Excel (una fila per material, columna de conjunt)</option>
                            <option value="bom">BOM de CAD indentada (columna de nivell)</option>
                        </select>
                    </div>
                    <div class="fi">
                        <label>Unitats de mida</label>
                        <select id="impMida"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">polzades</option></select>
                    </div>
                    <div class="fi">
                        <label>Unitats de pes</label>
                        <select id="impPes"><option value="g">g</option><option value="kg">kg</option><option value="lb">lb</option></select>
                    </div>
                </div>
                <div class="ajuda" id="impAjuda"></div>
                <div>
                    <div class="ps-t">Correspondència de columnes</div>
                    <div class="mapa" id="impMapa"></div>
                </div>
                <div class="prev" id="impPrev"></div>
                <div class="ajuda" id="impRes"></div>
            </div>
            <div class="dlg-f">
                <label class="ck"><input type="radio" name="impMode" value="afegeix" checked> Afegir / actualitzar</label>
                <label class="ck"><input type="radio" name="impMode" value="substitueix"> Substituir el projecte</label>
                <span class="fl"></span>
                <button class="b" data-tanca="dlgImport">Cancel·lar</button>
                <button class="b pr" id="impOk" disabled>Importar</button>
            </div>
        </div>
    </div>

    <!-- Configuració -->
    <div class="ov" id="dlgConfig">
        <div class="dlg">
            <div class="dlg-h">Configuració</div>
            <div class="dlg-c" id="cfgCos"></div>
            <div class="dlg-f">
                <button class="b" id="cfgDefecte">Valors per defecte</button>
                <span class="fl"></span>
                <button class="b pr" data-tanca="dlgConfig">Fet</button>
            </div>
        </div>
    </div>

    <!-- Afegir material existent -->
    <div class="ov" id="dlgExistent">
        <div class="dlg" style="width:560px">
            <div class="dlg-h">Afegir material existent al conjunt</div>
            <div class="dlg-c">
                <input class="cerca" id="exCerca" type="search" placeholder="Cerca…">
                <div style="max-height:50vh;overflow:auto"><table class="tt" id="exTaula"></table></div>
            </div>
            <div class="dlg-f"><button class="b" data-tanca="dlgExistent">Tancar</button></div>
        </div>
    </div>

    <input type="file" id="fObrir" accept=".json" style="display:none">

    <script src="js/fo-dades.js"></script>
    <script src="js/fo-calcul.js"></script>
    <script src="js/fo-stl.js"></script>
    <script src="js/fo-etiquetes.js"></script>
    <script src="js/fo-importa.js"></script>
    <script src="js/fo-vista3d.js"></script>
    <script src="js/fo-app.js"></script>
</body>
</html>
